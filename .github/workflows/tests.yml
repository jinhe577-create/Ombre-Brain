name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run local tests (no API key needed)
        # fork 定制：跑全量测试（LLM 相关用例无 key 自动跳过），
        # 覆盖 passage/etoile/持久化/更新源等 fork 回归，防止合并上游时误删文件
        run: python -m pytest tests/ -v --asyncio-mode=auto

      - name: Run LLM quality tests
        if: env.OMBRE_COMPRESS_API_KEY != ''
        env:
          OMBRE_COMPRESS_API_KEY: ${{ secrets.OMBRE_COMPRESS_API_KEY }}
        run: python -m pytest tests/test_llm_quality.py -v --asyncio-mode=auto
